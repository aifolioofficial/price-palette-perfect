
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimalist Pricing Table</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Minimalist Pricing</h1>
      <p>Compare features across all plans to find the right fit for you.</p>
    </div>

    <div class="pricing-comparison">
      <table class="comparison-table">
        <thead>
          <tr>
            <th></th>
            <th>Basic</th>
            <th>Pro</th>
            <th>Enterprise</th>
          </tr>
          <tr class="pricing-row">
            <td></td>
            <td>
              <div class="price">$9</div>
              <div class="period">/mo</div>
              <button class="button">Choose plan</button>
            </td>
            <td class="highlighted">
              <div class="price">$29</div>
              <div class="period">/mo</div>
              <button class="button button-dark">Choose plan</button>
            </td>
            <td>
              <div class="price">$99</div>
              <div class="period">/mo</div>
              <button class="button">Choose plan</button>
            </td>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Users</td>
            <td>1</td>
            <td>5</td>
            <td>Unlimited</td>
          </tr>
          <tr>
            <td>Storage</td>
            <td>10 GB</td>
            <td>50 GB</td>
            <td>500 GB</td>
          </tr>
          <tr>
            <td>Support</td>
            <td>Email</td>
            <td>Priority</td>
            <td>24/7</td>
          </tr>
          <tr>
            <td>Analytics</td>
            <td><span class="check">✓</span></td>
            <td><span class="check">✓</span></td>
            <td><span class="check">✓</span></td>
          </tr>
          <tr>
            <td>Export options</td>
            <td><span class="cross">✕</span></td>
            <td><span class="check">✓</span></td>
            <td><span class="check">✓</span></td>
          </tr>
          <tr>
            <td>API Access</td>
            <td><span class="cross">✕</span></td>
            <td><span class="check">✓</span></td>
            <td><span class="check">✓</span></td>
          </tr>
          <tr>
            <td>Custom domain</td>
            <td><span class="cross">✕</span></td>
            <td><span class="cross">✕</span></td>
            <td><span class="check">✓</span></td>
          </tr>
          <tr>
            <td>SSO</td>
            <td><span class="cross">✕</span></td>
            <td><span class="cross">✕</span></td>
            <td><span class="check">✓</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
